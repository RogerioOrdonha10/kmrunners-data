<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KM Runners — baixe o app</title>
<style>
  :root{--azul:#1e3a5f;--ouro:#ffc758}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:var(--azul);color:#fff;display:flex;min-height:100vh;
       align-items:center;justify-content:center;padding:24px}
  .caixa{max-width:420px;width:100%;text-align:center}
  h1{font-size:clamp(26px,7vw,36px);line-height:1.15;margin:0 0 12px;font-weight:800}
  p{color:#bcd4ee;font-size:17px;line-height:1.5;margin:0 0 28px}
  a.btn{display:block;background:#fff;color:var(--azul);text-decoration:none;
        font-weight:700;font-size:18px;padding:16px;border-radius:12px;margin-bottom:12px}
  a.btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.45)}
  .rod{margin-top:28px;color:#8fb3d6;font-size:14px}
  .rod a{color:#8fb3d6}
</style>
</head>
<body>
  <div class="caixa">
    <h1>O calendário das principais corridas de rua do Brasil</h1>
    <p>Encontre provas por cidade, distância e mês. Salve as suas e receba a data no calendário. Grátis, sem cadastro.</p>

    <a class="btn" href="https://play.google.com/store/apps/details?id=br.com.runbr&referrer=utm_source%3Dcamisa%26utm_medium%3Dprova%26utm_campaign%3Dmeia_18out">Baixar no Google Play</a>
    <a class="btn alt" href="https://apps.apple.com/br/app/km-runners/id6775238694?ct=camisa&pt=prova&mt=8">Baixar na App Store</a>

    <div class="rod"><a href="https://kmrunners.com.br">kmrunners.com.br</a> · @kmrunners.oficial</div>
  </div>
</body>
</html>
