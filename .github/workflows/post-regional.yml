name: Post regional

on:
  workflow_dispatch:
    inputs:
      estados:
        description: 'UFs separadas por vírgula (ex: AL,BA,CE,MA,PB,PE,PI,RN,SE)'
        required: true
        default: 'AL,BA,CE,MA,PB,PE,PI,RN,SE'
      titulo:
        description: 'Título COM preposição (ex: NO NORDESTE, EM SÃO PAULO, EM BERTIOGA)'
        required: true
        default: 'NO NORDESTE'
      dias_a_frente:
        description: 'Janela em dias a partir de hoje'
        required: false
        default: '60'

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests pillow

      - name: Gerar o post
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_EVENTOS: Eventos
          ESTADOS: ${{ github.event.inputs.estados }}
          TITULO: ${{ github.event.inputs.titulo }}
          DIAS_A_FRENTE: ${{ github.event.inputs.dias_a_frente }}
        run: python scripts/post_regional.py

      - name: Separar só os arquivos desta execução
        if: always()
        run: |
          mkdir -p saida
          git status --porcelain --untracked-files=all posts/ | awk '{print $NF}' | while read -r f; do
            cp "$f" saida/
          done
          echo "Arquivos desta execução:"
          ls -la saida

      - name: Guardar como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-regional
          path: saida/
          if-no-files-found: ignore

      - name: Publicar os arquivos no repositório
        run: |
          git config user.name  "km-runners-bot"
          git config user.email "bot@kmrunners.com.br"
          git add posts/
          if git diff --staged --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "post regional gerado automaticamente"
            git push
          fi
